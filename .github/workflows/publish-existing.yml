name: Retry paired release publication
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v0.1.3'
        required: true
      build_run_id:
        description: 'Release workflow run whose macOS ARM64, macOS x64 and Windows x64 build jobs succeeded'
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_RUN: ${{ inputs.build_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify artifact provenance and successful native builds
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          export EXPECTED_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
          gh run view "$SOURCE_RUN" --json headSha,workflowName,jobs > source-run.json
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("source-run.json")); if(r.headSha!==process.env.EXPECTED_SHA || r.workflowName!=="Build paired client release" || !["build (macos-14)","build (macos-15-intel)","build (windows-latest)"].every(name=>r.jobs.some(j=>j.name===name && j.conclusion==="success"))) throw new Error("Unverified release artifacts");'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Validate and publish all paired artifacts
        run: |
          node scripts/stage-release.mjs artifacts release "${RELEASE_TAG#v}"
          git show "$RELEASE_TAG:desktop/RELEASE_NOTES.md" > release-notes.md
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json; then
            node -e 'if (!require("./existing-release.json").isDraft) throw new Error("Refusing to replace a published release")'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Portal Desktop $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
